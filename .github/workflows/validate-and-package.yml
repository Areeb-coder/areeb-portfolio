name: Validate and package portfolio

on:
  push:
    branches: [main, dot/audio-pack-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Verify supplied Dot audio pack assets
        run: |
          for asset in dot-ambient-loop.mp3 sfx-dot-hover.mp3 sfx-dot-move.mp3 sfx-dot-playful.mp3 sfx-dot-discovery.mp3 sfx-dot-transition.mp3 sfx-dot-land.mp3 sfx-ui-soft-click.mp3; do
            test -s "public/audio/$asset" || { echo "::error file=public/audio/$asset::Missing required Dot audio asset"; exit 1; }
          done

      - name: Package complete source
        run: |
          zip -r Areeb-Portfolio-Final-Fixed.zip . \
            -x ".git/*" "*/.git/*" \
               "node_modules/*" "*/node_modules/*" \
               ".next/*" "*/.next/*" \
               "Areeb-Portfolio-Final-Fixed.zip" \
               ".env" ".env.local" ".env.*.local"

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: Areeb-Portfolio-Final-Fixed
          path: Areeb-Portfolio-Final-Fixed.zip
          if-no-files-found: error
          retention-days: 30
