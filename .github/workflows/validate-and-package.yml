name: Validate and package portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Package complete source
        run: |
          zip -r Areeb-Portfolio-Final-Fixed.zip . \
            -x ".git/*" "*/.git/*" \
               "node_modules/*" "*/node_modules/*" \
               ".next/*" "*/.next/*" \
               "Areeb-Portfolio-Final-Fixed.zip" \
               ".env" ".env.local" ".env.*.local"

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: Areeb-Portfolio-Final-Fixed
          path: Areeb-Portfolio-Final-Fixed.zip
          if-no-files-found: error
          retention-days: 30
